<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Technology and Innovation Conference</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-bar">
            <a href="index.html" class="brand">STIC 2026</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="register.html" class="active">Register</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="register-layout">
            <!-- Registration form. novalidate turns off browser validation so js/script.js handles it -->
            <section class="form-card">
                <h1>Conference Registration</h1>
                <p class="intro">Complete the form below. Your fee updates automatically as you choose options.</p>

                <form id="registrationForm" action="process.php" method="POST" novalidate>

                    <fieldset>
                        <legend>Personal Details</legend>

                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" placeholder="e.g. Mary Wanjiku">
                            <span class="error-message" id="fullNameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="admissionNumber">Admission Number</label>
                            <input type="text" id="admissionNumber" name="admissionNumber" placeholder="e.g. CT100/G/24900/24">
                            <span class="error-message" id="admissionNumberError"></span>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="e.g. mary@example.com">
                            <span class="error-message" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="e.g. 0712345678">
                            <span class="error-message" id="phoneError"></span>
                        </div>

                        <div class="form-group">
                            <label for="yearOfStudy">Year of Study</label>
                            <select id="yearOfStudy" name="yearOfStudy">
                                <option value="">Select your year</option>
                                <option value="1">Year 1</option>
                                <option value="2">Year 2</option>
                                <option value="3">Year 3</option>
                                <option value="4">Year 4</option>
                            </select>
                            <span class="error-message" id="yearOfStudyError"></span>
                        </div>
                    </fieldset>
